name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx opennextjs-cloudflare build

  deploy:
    # Deploys main to Cloudflare once the repo has the two Cloudflare secrets.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: gate
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cloudflare secrets are not set yet, skipping deploy."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.ready == 'true'
      - name: Find or create the D1 database
        if: steps.gate.outputs.ready == 'true'
        run: |
          # Lists databases. Fails with wrangler's own message when the token
          # or account id is wrong, instead of a confusing parse error.
          list() {
            if ! out="$(npx wrangler d1 list --json 2>&1)"; then
              echo "$out" >&2
              echo "::error::Cloudflare refused the request. Check that CLOUDFLARE_API_TOKEN has Account > D1 > Edit and Account > Workers Scripts > Edit, and that CLOUDFLARE_ACCOUNT_ID is the account that token belongs to." >&2
              return 1
            fi
            # Keep only the JSON array, in case wrangler prints notices first.
            echo "$out" | sed -n '/^\[/,$p'
          }
          find_id() {
            listed="$(list)" || return 1
            echo "$listed" | jq -r '.[] | select(.name == "holdfast") | .uuid'
          }
          id="$(find_id)" || exit 1
          if [ -z "$id" ]; then
            npx wrangler d1 create holdfast
            id="$(find_id)" || exit 1
          fi
          if [ -z "$id" ]; then
            echo "::error::Could not find or create the holdfast D1 database."
            exit 1
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.jsonc
      - name: Apply database migrations
        if: steps.gate.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply holdfast --remote
      - name: Build and deploy
        if: steps.gate.outputs.ready == 'true'
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
