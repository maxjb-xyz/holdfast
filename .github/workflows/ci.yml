name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx opennextjs-cloudflare build

  deploy:
    # Deploys main to Cloudflare once the repo has the two Cloudflare secrets.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: gate
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cloudflare secrets are not set yet, skipping deploy."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.ready == 'true'
      - name: Find or create the D1 database
        if: steps.gate.outputs.ready == 'true'
        run: |
          find_id() {
            npx wrangler d1 list --json | jq -r '.[] | select(.name == "holdfast") | .uuid'
          }
          id="$(find_id)"
          if [ -z "$id" ]; then
            npx wrangler d1 create holdfast
            id="$(find_id)"
          fi
          test -n "$id"
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.jsonc
      - name: Apply database migrations
        if: steps.gate.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply holdfast --remote
      - name: Build and deploy
        if: steps.gate.outputs.ready == 'true'
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
